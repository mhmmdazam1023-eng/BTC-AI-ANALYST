# ============================================================
# Bitcoin AI Analyst - Local TimescaleDB (PostgreSQL 16)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f timescaledb
#
# Variables are read from the `.env` file in this directory
# (Docker Compose loads it automatically). Defaults below match
# `.env.example` and `src/config.py`.
# ============================================================
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bitcoin_ai_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btc_analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-bitcoin_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btc_analyst} -d ${POSTGRES_DB:-bitcoin_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  timescale_data:
    name: bitcoin_ai_timescale_data
